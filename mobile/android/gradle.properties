# --enable-native-access silences a JDK warning raised by Gradle's own
# native-platform library, not by anything in this project. It is accepted
# from JDK 21 onward, which is also the floor Gradle 8.12 needs, so the two
# constraints agree: build with 21, 22 or 23.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true
