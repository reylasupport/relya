name: relya
description: "Personal life assistant. Send anything, it remembers for you."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.9.0

  # Auth (native providers)
  sign_in_with_apple: ^6.1.4

  # Capture
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  receive_sharing_intent: ^1.8.1
  google_mlkit_text_recognition: ^0.15.0

  # Reminders / calendar
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  add_2_calendar: ^3.0.1
  permission_handler: ^11.3.1

  # Monetisation, analytics, observability
  purchases_flutter: ^8.6.0
  posthog_flutter: ^4.10.0
  sentry_flutter: ^8.14.0

  # Storage & platform
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  # Joining outbox paths. Already in the tree transitively; declared because
  # we import it directly.
  path: ^1.9.0
  package_info_plus: ^8.1.2
  # Handing the data export to the OS share sheet. Without this, "export my
  # data" has nowhere to put the file it just built.
  share_plus: ^10.1.4
  device_info_plus: ^11.2.0
  connectivity_plus: ^6.1.1
  url_launcher: ^6.3.1

  # Utilities
  intl: any
  collection: ^1.19.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    # assets/demo/ was declared here and was always empty: the demo data is
    # code in shared/data/mock and the artwork is painted, not loaded. Git
    # does not carry an empty directory, so a clean checkout had no such path
    # and analyze --fatal-infos failed on a warning that never appeared on a
    # machine where the stray folder happened to exist.
    #
    # Only the launcher-icon sources are real, and they are read by
    # flutter_launcher_icons at build time rather than through the bundle.
    - assets/brand/

  # The editorial serif of Concept F. Merriweather, SIL Open Font License 1.1;
  # the licence travels with the files in assets/fonts/merriweather/OFL.txt.
  # Bundled rather than resolved through the platform 'serif' family, because
  # that family is not guaranteed to exist and a missing heading font renders
  # as empty boxes.
  fonts:
    - family: Merriweather
      fonts:
        - asset: assets/fonts/merriweather/Merriweather-Light.ttf
          weight: 300
        - asset: assets/fonts/merriweather/Merriweather-Regular.ttf
          weight: 400
        - asset: assets/fonts/merriweather/Merriweather-BoldItalic.ttf
          weight: 700
          style: italic

# Launcher icons. The PNGs are generated from the same painter the app draws
# with: flutter test tool/generate_brand_assets.dart
flutter_launcher_icons:
  image_path: "assets/brand/icon.png"
  android: true
  adaptive_icon_background: "#3D5AFE"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  # Apple rejects icons with transparency, and rounds the corners itself.
  ios: true
  remove_alpha_ios: true
