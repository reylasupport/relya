name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.6"

jobs:
  analyse-and-test:
    name: Analyse and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: mobile/coverage/lcov.info

  edge-functions:
    name: Edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check
        run: deno check supabase/functions/**/index.ts
        continue-on-error: false
      - name: Lint
        run: deno lint supabase/functions
      - name: Test
        run: deno test supabase/functions/_tests

  build-android:
    name: Build Android
    needs: analyse-and-test
    runs-on: ubuntu-latest
    # Only on main: a debug APK per pull request is not worth the minutes.
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Write build configuration
        run: |
          mkdir -p env
          cp env/example.json env/ci.json
      - run: flutter build apk --debug --dart-define-from-file=env/ci.json

  build-ios:
    name: Build iOS
    needs: analyse-and-test
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: cp env/example.json env/ci.json
      # No signing in CI: this proves the project compiles, releases are cut
      # from a signed workflow with the certificates in secrets.
      - run: flutter build ios --no-codesign --dart-define-from-file=env/ci.json
